<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas responsive QA</title><style>body{margin:0;background:#dce3e9;color:#25323e;font:13px system-ui}header{display:flex;gap:15px;align-items:center;padding:14px 18px;background:white;border-bottom:1px solid #bbc8d3;position:sticky;left:0;top:0;z-index:2;width:max-content;min-width:100%;box-sizing:border-box}label{display:flex;align-items:center;gap:8px}select{padding:7px;border:1px solid #bbc8d3;border-radius:4px}main{padding:20px;width:max-content}iframe{display:block;background:white;border:0;box-shadow:0 3px 20px #1f34452b}p{margin:0;color:#65717d;font-size:11px}</style><header><strong>真实浏览器响应检查</strong><label>视口<select id="size"><option value="1440,1000">桌面 1440×1000</option><option value="390,844">手机 390×844</option></select></label><label>主题<select id="theme"><option value="">主题地图集</option><option value="nakasendo">中山道</option><option value="francigena">Via Francigena</option><option value="andes">安第斯道路网</option><option value="buddhist">佛教四圣地</option><option value="canal">大运河</option><option value="viking">维京</option><option value="impressionism">印象派</option><option value="mozart">莫扎特</option><option value="route66">66 号公路</option><option value="nc500">NC500</option></select></label><p>iframe 使用真实 CSS 视口；不是实机测试。</p></header><main><iframe title="Atlas responsive preview" width="1440" height="1000" src="../index.html"></iframe></main><script>const frame=document.querySelector('iframe');document.querySelector('#size').onchange=e=>{const [w,h]=e.target.value.split(',');frame.width=w;frame.height=h};document.querySelector('#theme').onchange=e=>{frame.src='../index.html'+(e.target.value?'#theme='+e.target.value+'&view=places':'')};</script></html>
