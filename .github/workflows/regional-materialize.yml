name: Materialize regional expansion photographs
on:
  push:
    branches: [codex/richer-regional-themes, codex/regional-writing-landscapes, codex/remaining-thirty, codex/thirty-europe-ready, codex/thirty-americas-ready]
    paths:
      - data/theme-review/regional-expansion.json
      - scripts/materialize-regional-media.py
      - .github/workflows/regional-materialize.yml
permissions:
  contents: write
concurrency:
  group: regional-expansion-media
  cancel-in-progress: false
jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: python scripts/materialize-regional-media.py
      - run: python scripts/review-remaining-media.py
      - run: python scripts/review-thirty-coordinates.ci.py
      - name: Save attributed place photographs on the working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/regional-expansion regional-theme-expansion-media.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialize place-matched regional photographs and licence records'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: regional-photograph-review
          path: |
            assets/regional-expansion/
            qa/remaining-media/
