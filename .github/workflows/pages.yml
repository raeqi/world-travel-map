name: Test and deploy travel map

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          terra_syntax_count=0
          for file in *.js scripts/*.cjs tests/*.cjs; do
            node --check "$file"
            terra_syntax_count=$((terra_syntax_count+1))
          done
          echo "Checked $terra_syntax_count JavaScript/CJS files."
      - name: Check repository documentation
        run: node scripts/check-docs.cjs
      - name: Run project tests
        run: node --test tests/*.test.cjs
      - name: Prepare public site
        run: node scripts/build-site.cjs
      - name: Upload public site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@v4

  verify-published:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the public document and every versioned script and stylesheet
        run: node scripts/check-published-release.cjs
