name: Place content quality checks
on:
  pull_request:
    paths: ['index.html','reading.js','cultural-atlas.js','quality-readings*.js','data/content-quality/**','qa/content-quality/**','scripts/content-quality-runtime.cjs','scripts/content-quality-packs.cjs','scripts/build-quality-readings.cjs','scripts/audit-content.cjs','scripts/check-content-quality.cjs','tests/content-quality.test.cjs','.github/workflows/content-quality.yml']
  workflow_dispatch:
jobs:
  content:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-quality-readings.cjs --check
      - run: node --test tests/*.test.cjs
      - run: node scripts/audit-content.cjs
      - name: Install isolated browser tools
        run: |
          npm install --prefix /tmp/content-tools --no-save playwright@1.56.1
          /tmp/content-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Check reviewed readings on desktop and mobile
        env:
          NODE_PATH: /tmp/content-tools/node_modules
        run: |
          scope=''
          base='${{ github.event.pull_request.base.sha }}'
          if [ -n "$base" ] && git diff --quiet "$base" HEAD -- data/content-quality quality-readings.js quality-readings-data.js scripts/content-quality-runtime.cjs scripts/content-quality-packs.cjs; then
            scope='regional-expansion'
          fi
          CONTENT_QA_SCOPE="$scope" node scripts/run-browser-suite.cjs check-content-quality.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: place-content-quality-browser
          path: qa/content-quality-browser
          retention-days: 14
