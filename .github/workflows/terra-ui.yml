name: Terra Mosaic browser checks

on:
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'assets/brand/**'
      - 'scripts/check-terra-ui.cjs'
      - 'scripts/check-carousel.cjs'
      - '.github/workflows/terra-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terra-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test tools
        run: npm install --no-save --no-package-lock jsdom@26.1.0 playwright@1.56.1
      - name: Check carousel behaviour
        run: node scripts/check-carousel.cjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/terra-http.log 2>&1 &
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/terra-http.log
          exit 1
      - name: Check desktop and mobile UI
        run: node scripts/check-terra-ui.cjs
      - name: Upload real browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terra-mosaic-browser
          path: qa/terra-mosaic/
          if-no-files-found: ignore
          retention-days: 14
