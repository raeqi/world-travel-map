name: Theme preservation and discovery
on:
  pull_request:
    branches: [main]
    paths:
      - '*.js'
      - 'tests/theme-discoverability.test.cjs'
      - 'scripts/*theme*.cjs'
      - 'qa/theme-review/**'
      - '.github/workflows/theme-review.yml'
permissions:
  contents: read
jobs:
  preservation-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: consolidated-maps
            scripts: check-catalogue-expansion.cjs
          - suite: source-discovery
            scripts: check-theme-discoverability.cjs check-short-theme-review.cjs
          - suite: regional-expansion
            scripts: check-regional-expansion.cjs
          - suite: cultural-maps-desktop-1
            scripts: check-cultural-theme-maps.cjs
            viewport: desktop
            shard: '1'
            shards: '4'
          - suite: cultural-maps-desktop-2
            scripts: check-cultural-theme-maps.cjs
            viewport: desktop
            shard: '2'
            shards: '4'
          - suite: cultural-maps-desktop-3
            scripts: check-cultural-theme-maps.cjs
            viewport: desktop
            shard: '3'
            shards: '4'
          - suite: cultural-maps-desktop-4
            scripts: check-cultural-theme-maps.cjs
            viewport: desktop
            shard: '4'
            shards: '4'
          - suite: cultural-maps-mobile-1
            scripts: check-cultural-theme-maps.cjs
            viewport: mobile
            shard: '1'
            shards: '4'
          - suite: cultural-maps-mobile-2
            scripts: check-cultural-theme-maps.cjs
            viewport: mobile
            shard: '2'
            shards: '4'
          - suite: cultural-maps-mobile-3
            scripts: check-cultural-theme-maps.cjs
            viewport: mobile
            shard: '3'
            shards: '4'
          - suite: cultural-maps-mobile-4
            scripts: check-cultural-theme-maps.cjs
            viewport: mobile
            shard: '4'
            shards: '4'
          - suite: cultural-atlas
            scripts: check-cultural-atlas-browser.cjs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - run: node scripts/audit-theme-preservation.cjs
      - run: node scripts/audit-regional-expansion.cjs
      - run: node scripts/audit-remaining-thirty.cjs
      - run: node scripts/audit-catalogue-consolidation.cjs
      - run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Exercise recovery and old links in actual desktop and mobile Chromium
        env:
          CULTURAL_QA_VIEWPORT: ${{ matrix.viewport || '' }}
          CULTURAL_QA_SHARD: ${{ matrix.shard || '' }}
          CULTURAL_QA_SHARDS: ${{ matrix.shards || '' }}
        run: node scripts/run-browser-suite.cjs ${{ matrix.scripts }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-review-browser-${{ matrix.suite }}
          path: |
            qa/regional-expansion-browser/
            qa/theme-review/
            qa/catalogue-consolidation-browser/
            qa/catalogue-expansion-browser/
            qa/cultural-theme-maps/
            qa/cultural-atlas-browser/
