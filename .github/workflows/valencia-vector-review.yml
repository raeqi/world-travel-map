name: Valencia vector point regression (no deployment)
on:
  pull_request:
    branches: [main]
    paths:
      - 'real-map.js'
      - 'scripts/map-render-probe.cjs'
      - 'scripts/check-valencia-regression.cjs'
      - '.github/workflows/valencia-vector-review.yml'
permissions:
  contents: read
concurrency:
  group: valencia-vector-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vector-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        renderer: [default, swiftshader]
    env:
      VALENCIA_RENDERER: ${{ matrix.renderer }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/valencia-tools" --no-save --no-package-lock playwright@1.65.1
          "$RUNNER_TEMP/valencia-tools/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/valencia-tools/node_modules" >> "$GITHUB_ENV"
      - name: Reproduce actual point rendering without raster credentials
        run: node scripts/run-browser-suite.cjs check-valencia-regression.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valencia-vector-${{ matrix.renderer }}-${{ github.run_id }}
          path: qa-artifacts/valencia/
          retention-days: 14
